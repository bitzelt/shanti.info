<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cámara Fullscreen COVER</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
}
canvas { display: block; }
</style>
</head>

<body>
<script>
let video;
let zoom = 1;
let lastDist = 0;

// Paleta (la que venías usando)
const palette = [
  [233,116,98],   // salmón oscuro
  [0,120,255],    // azul radiante
  [175,238,238],  // celeste pastel
  [45,45,45]      // gris oscuro
];

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);

  video = createCapture({
    video: {
      facingMode: "environment" // cualquier cámara
    },
    audio: false
  });

  // resolución base estable
  video.size(640, 480);
  video.hide();
}

function draw() {
  background(0);
  if (video.width === 0) return;

  const vw = video.width;
  const vh = video.height;

  // 🔴 COVER SIEMPRE (llena pantalla)
  const scale = max(width / vw, height / vh) * zoom;
  const ox = (width  - vw * scale) * 0.5;
  const oy = (height - vh * scale) * 0.5;

  video.loadPixels();
  loadPixels();

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {

      const sx = int((x - ox) / scale);
      const sy = int((y - oy) / scale);

      if (sx < 0 || sy < 0 || sx >= vw || sy >= vh) continue;

      const i = (sx + sy * vw) * 4;
      const r = video.pixels[i];
      const g = video.pixels[i+1];
      const b = video.pixels[i+2];

      const gray = (r + g + b) / 3;
      const level =
        gray < 85  ? 0 :
        gray < 145 ? 1 :
        gray < 205 ? 2 : 3;

      const c = palette[level];
      const di = (x + y * width) * 4;

      pixels[di]     = c[0];
      pixels[di + 1] = c[1];
      pixels[di + 2] = c[2];
      pixels[di + 3] = 255;
    }
  }

  updatePixels();
}

// Zoom con pellizco
function touchMoved() {
  if (touches.length === 2) {
    const d = dist(
      touches[0].x, touches[0].y,
      touches[1].x, touches[1].y
    );
    if (lastDist > 0) {
      zoom *= 1 + (d - lastDist) / 300;
      zoom = constrain(zoom, 1, 4);
    }
    lastDist = d;
  }
  return false;
}

function touchEnded() {
  if (touches.length < 2) lastDist = 0;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
